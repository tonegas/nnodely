[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[project]
name = "nnodely"
version = "2.0.0"
description = "Model-structured neural network framework for the modeling and control of physical systems"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Gastone Pietro Rosati Papini", email = "tonegas@gmail.com" },
]
keywords = [
  "neural networks",
  "physics-informed",
  "system identification",
  "control",
  "neural ODE",
  "keras",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "graphviz>=0.21",
  # From 3.14 the torch backend exports ONNX wrongly: a Loop fails to convert
  # and outputs can come back under each other's names. Lift once fixed.
  "keras>=3.12.1,<3.14",
  "matplotlib>=3.10.8",
  "numpy>=1.26.4",
  "pandas>=2.3.3",
]

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.21.0"]
torch = ["torch>=2.2.2"]
jax = ["jax>=0.6.2"]
onnx = [
  "onnx>=1.16.0",
  "onnxruntime>=1.18.0",
  "onnxscript>=0.1.0",
  # Keras exports ONNX from TensorFlow through tf2onnx.
  "tf2onnx>=1.17.0",
]

[project.urls]
"Homepage" = "https://github.com/tonegas/nnodely"
"Documentation" = "https://nnodely.readthedocs.io/"
"Repository" = "https://github.com/tonegas/nnodely"
"Issues" = "https://github.com/tonegas/nnodely/issues"
"Changelog" = "https://github.com/tonegas/nnodely/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pre-commit>=4.5.1",
  "pyright>=1.1.408",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.10",
]

[tool.uv]
# onnxruntime 1.24.1-1.24.3 declare Python >=3.10 but ship no 3.10 wheels, so
# a lock shared by every Python picks one that 3.10 cannot install. pip skips
# them on its own; this only steers the lock.
# scipy 1.15.3, the last release for 3.10, ships macOS wheels whose extensions
# macOS 27's dyld refuses to load (a __thread_bss section with a file offset),
# so every newer Python is steered to a release that loads.
constraint-dependencies = [
  "onnxruntime<1.24; python_version < '3.11'",
  "scipy>=1.16; python_version >= '3.11'",
]

[tool.uv.build-backend]
# Finder writes .DS_Store files into the folders it opens, and the build takes
# every file of the package otherwise.
source-exclude = ["**/.DS_Store"]
wheel-exclude = ["**/.DS_Store"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py310"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"
markers = [
  "slow: marks tests that perform longer-running training or application workflows",
]
