[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[project]
name = "nnodely"
version = "2.0.0"
description = "Model-structured neural network framework for the modeling and control of physical systems"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Gastone Pietro Rosati Papini", email = "tonegas@gmail.com" },
]
keywords = [
  "neural networks",
  "physics-informed",
  "system identification",
  "control",
  "neural ODE",
  "keras",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "keras>=3.15.1",
  "matplotlib>=3.10.8",
  "numpy>=1.26.4",
  # Every model exports to ONNX, and validate_onnx runs the file.
  "onnx>=1.16.0",
  "onnxruntime>=1.18.0",
  "pandas>=2.3.3",
  # EquationLearner.plot() writes the learned equation with it.
  "sympy>=1.13.3",
]

# Each backend comes with the converter Keras exports ONNX with from it.
[project.optional-dependencies]
tensorflow = ["tensorflow>=2.21.0", "tf2onnx>=1.17.0"]
torch = ["torch>=2.2.2", "onnxscript>=0.1.0"]
jax = ["jax>=0.8.1", "jax2onnx>=0.19.1"]

[project.urls]
"Homepage" = "https://github.com/tonegas/nnodely"
"Documentation" = "https://nnodely.readthedocs.io/"
"Repository" = "https://github.com/tonegas/nnodely"
"Issues" = "https://github.com/tonegas/nnodely/issues"
"Changelog" = "https://github.com/tonegas/nnodely/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pre-commit>=4.5.1",
  "pyright>=1.1.408",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.10",
]

[tool.uv.build-backend]
# Finder writes .DS_Store files into the folders it opens, and the build takes
# every file of the package otherwise.
source-exclude = ["**/.DS_Store"]
wheel-exclude = ["**/.DS_Store"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
# Keras ships no types: inferred from its code, every keras.ops result is
# also None, from the backends whose implementation can return nothing.
useLibraryCodeForTypes = false
exclude = ["experimental", "docs/_build", "**/.venv", "**/__pycache__", "**/node_modules", "**/.*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# The backend is chosen, and Keras imported, before the package imports.
"src/nnodely/__init__.py" = ["E402"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"
markers = [
  "slow: marks tests that perform longer-running training or application workflows",
]
