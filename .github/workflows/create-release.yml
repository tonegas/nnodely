name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and publish to both TestPyPi and PyPi
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Validate tag matches project version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJ_VERSION=$(uv version --short)

          echo "Tag version: $TAG_VERSION"
          echo "Project version: $PROJ_VERSION"

          if [ "$TAG_VERSION" != "$PROJ_VERSION" ]; then
            echo "Mismatch: tag=$TAG_VERSION project=$PROJ_VERSION"
            exit 1
          fi

      - name: Build
        run: uv build

      # Install each artifact with a real backend and run a small model through
      # it, exporting its HTML page from the packaged template, so a file left
      # out of the package fails here, before anything is published.
      - name: Smoke test (wheel and source distribution)
        env:
          KERAS_BACKEND: jax
          SMOKE: |
            import tempfile, numpy as np
            from nnodely import Fir, Input, Modely, Output
            x = Input("x")
            model = Modely("smoke", inputs=[x], outputs=[Output("y", Fir(features=1)(x.sw(3)))]).build()
            print(model({"x": np.ones((1, 1, 3), "float32")})["y"].shape)
            model.export_html(tempfile.mkdtemp())
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            uv run --isolated --no-project --with "nnodely[jax] @ $(realpath "$artifact")" python -c "$SMOKE"
          done

      - name: TestPyPi publish
        run: uv publish --index testpypi

      - name: PyPI publish
        run: uv publish

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  github-release:
    name: Sign the Python with Sigstore and upload them to GitHub Release
    runs-on: ubuntu-latest
    needs:
      - publish

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Sign artifacts
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: |
            ./dist/*.tar.gz
            ./dist/*.whl
      - name: Detect prerelease
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.PRERELEASE }}
