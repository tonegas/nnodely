    function escapeHtml(text) {
        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatValue(value) {
        if (value === null || value === undefined) return "";
        if (typeof value === "object") {
            return `<pre style="margin:0; white-space:pre-wrap;">${escapeHtml(JSON.stringify(value, null, 2))}</pre>`;
        }
        return escapeHtml(String(value));
    }

    function renderInspector(nodeId) {
        const details = nodeDetails[nodeId];
        const n = nodes.get(nodeId);

        if (!details) {
            inspectorContent.innerHTML = '<div class="empty">No details available for this node.</div>';
            return;
        }

        const rows = Object.entries(details).map(([key, value]) => {
            return `
            <tr>
                <th>${escapeHtml(key)}</th>
                <td>${formatValue(value)}</td>
            </tr>
            `;
        }).join("");

        let extra = "";
        if (n && n.url) {
            extra = `<a class="open-link" href="${escapeHtml(n.url)}" target="_self">Open nested model</a>`;
        }

        inspectorContent.innerHTML = `
            <table class="attr-table">
                <tbody>${rows}</tbody>
            </table>
            ${extra}
        `;
    }

        if (!params.nodes || params.nodes.length === 0) return;
        const nodeId = params.nodes[0];
        renderInspector(nodeId);

        if (!params.nodes || params.nodes.length === 0) return;
        const nodeId = params.nodes[0];
        const n = nodes.get(nodeId);
        if (n && n.url) {
            const target = "_self";
            if (target === "_blank") {

            } else {
                window.location.href = n.url;
            }
        }
