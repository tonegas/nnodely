<script>
    const nodes = new vis.DataSet([{"id": "rhs_state", "label": "rhs_state", "shape": "dot", "size": 14, "color": {"background": "#2ecc71", "border": "#2c3e50", "highlight": {"background": "#f1c40f", "border": "#2c3e50"}}, "font": {"color": "#111111"}}, {"id": "SampleWindow1", "label": "SampleWindow1", "shape": "dot", "size": 14, "color": {"background": "#95a5a6", "border": "#2c3e50", "highlight": {"background": "#f1c40f", "border": "#2c3e50"}}, "font": {"color": "#111111"}}, {"id": "rhs_linear_1", "label": "rhs_linear_1", "shape": "dot", "size": 14, "color": {"background": "#95a5a6", "border": "#2c3e50", "highlight": {"background": "#f1c40f", "border": "#2c3e50"}}, "font": {"color": "#111111"}}, {"id": "rhs_relu_1", "label": "rhs_relu_1", "shape": "dot", "size": 14, "color": {"background": "#95a5a6", "border": "#2c3e50", "highlight": {"background": "#f1c40f", "border": "#2c3e50"}}, "font": {"color": "#111111"}}, {"id": "rhs_linear_2", "label": "rhs_linear_2", "shape": "dot", "size": 14, "color": {"background": "#95a5a6", "border": "#2c3e50", "highlight": {"background": "#f1c40f", "border": "#2c3e50"}}, "font": {"color": "#111111"}}, {"id": "rhs_relu_2", "label": "rhs_relu_2", "shape": "dot", "size": 14, "color": {"background": "#95a5a6", "border": "#2c3e50", "highlight": {"background": "#f1c40f", "border": "#2c3e50"}}, "font": {"color": "#111111"}}, {"id": "rhs_linear_3", "label": "rhs_linear_3", "shape": "dot", "size": 14, "color": {"background": "#95a5a6", "border": "#2c3e50", "highlight": {"background": "#f1c40f", "border": "#2c3e50"}}, "font": {"color": "#111111"}}, {"id": "rhs_relu_3", "label": "rhs_relu_3", "shape": "dot", "size": 14, "color": {"background": "#95a5a6", "border": "#2c3e50", "highlight": {"background": "#f1c40f", "border": "#2c3e50"}}, "font": {"color": "#111111"}}, {"id": "rhs_derivative_linear", "label": "rhs_derivative_linear", "shape": "dot", "size": 14, "color": {"background": "#95a5a6", "border": "#2c3e50", "highlight": {"background": "#f1c40f", "border": "#2c3e50"}}, "font": {"color": "#111111"}}, {"id": "state_derivative", "label": "state_derivative", "shape": "dot", "size": 14, "color": {"background": "#e74c3c", "border": "#2c3e50", "highlight": {"background": "#f1c40f", "border": "#2c3e50"}}, "font": {"color": "#111111"}}]);
    const edges = new vis.DataSet([{"from": "rhs_state", "to": "SampleWindow1", "arrows": "to", "label": "(2, 1)", "font": {"align": "middle", "size": 10}, "title": "{\n  \"from class\": \"Input\",\n  \"to class\": \"SampleWindow\",\n  \"shape\": \"(2, 1)\"\n}", "color": {"color": "#7f8c8d"}}, {"from": "SampleWindow1", "to": "rhs_linear_1", "arrows": "to", "label": "(2, 1)", "font": {"align": "middle", "size": 10}, "title": "{\n  \"from class\": \"SampleWindow\",\n  \"to class\": \"Linear\",\n  \"shape\": \"(2, 1)\"\n}", "color": {"color": "#7f8c8d"}}, {"from": "rhs_linear_1", "to": "rhs_relu_1", "arrows": "to", "label": "(60, 1)", "font": {"align": "middle", "size": 10}, "title": "{\n  \"from class\": \"Linear\",\n  \"to class\": \"ReLU\",\n  \"shape\": \"(60, 1)\"\n}", "color": {"color": "#7f8c8d"}}, {"from": "rhs_relu_1", "to": "rhs_linear_2", "arrows": "to", "label": "(60, 1)", "font": {"align": "middle", "size": 10}, "title": "{\n  \"from class\": \"ReLU\",\n  \"to class\": \"Linear\",\n  \"shape\": \"(60, 1)\"\n}", "color": {"color": "#7f8c8d"}}, {"from": "rhs_linear_2", "to": "rhs_relu_2", "arrows": "to", "label": "(60, 1)", "font": {"align": "middle", "size": 10}, "title": "{\n  \"from class\": \"Linear\",\n  \"to class\": \"ReLU\",\n  \"shape\": \"(60, 1)\"\n}", "color": {"color": "#7f8c8d"}}, {"from": "rhs_relu_2", "to": "rhs_linear_3", "arrows": "to", "label": "(60, 1)", "font": {"align": "middle", "size": 10}, "title": "{\n  \"from class\": \"ReLU\",\n  \"to class\": \"Linear\",\n  \"shape\": \"(60, 1)\"\n}", "color": {"color": "#7f8c8d"}}, {"from": "rhs_linear_3", "to": "rhs_relu_3", "arrows": "to", "label": "(60, 1)", "font": {"align": "middle", "size": 10}, "title": "{\n  \"from class\": \"Linear\",\n  \"to class\": \"ReLU\",\n  \"shape\": \"(60, 1)\"\n}", "color": {"color": "#7f8c8d"}}, {"from": "rhs_relu_3", "to": "rhs_derivative_linear", "arrows": "to", "label": "(60, 1)", "font": {"align": "middle", "size": 10}, "title": "{\n  \"from class\": \"ReLU\",\n  \"to class\": \"Linear\",\n  \"shape\": \"(60, 1)\"\n}", "color": {"color": "#7f8c8d"}}, {"from": "rhs_derivative_linear", "to": "state_derivative", "arrows": "to", "label": "(2, 1)", "font": {"align": "middle", "size": 10}, "title": "{\n  \"from class\": \"Linear\",\n  \"to class\": \"Output\",\n  \"shape\": \"(2, 1)\"\n}", "color": {"color": "#7f8c8d"}}]);
    const nodeDetails = {"rhs_state": {"class": "Input", "name": "rhs_state", "seq": "()", "time": "1", "dim": "(2,)", "shape": "(2, 1)"}, "SampleWindow1": {"class": "SampleWindow", "name": "SampleWindow1", "seq": "()", "time": "1", "dim": "(2,)", "shape": "(2, 1)", "properties": {"past": 1, "future": 0}}, "rhs_linear_1": {"class": "Linear", "name": "rhs_linear_1", "seq": "()", "time": "1", "dim": "(60,)", "shape": "(60, 1)", "properties": {"out_features": 60, "use_bias": true, "initializer": "glorot_uniform", "bias_initializer": "glorot_uniform"}}, "rhs_relu_1": {"class": "ReLU", "name": "rhs_relu_1", "seq": "()", "time": "1", "dim": "(60,)", "shape": "(60, 1)", "properties": {"max_value": null, "negative_slope": 0.0, "threshold": 0.0}}, "rhs_linear_2": {"class": "Linear", "name": "rhs_linear_2", "seq": "()", "time": "1", "dim": "(60,)", "shape": "(60, 1)", "properties": {"out_features": 60, "use_bias": true, "initializer": "glorot_uniform", "bias_initializer": "glorot_uniform"}}, "rhs_relu_2": {"class": "ReLU", "name": "rhs_relu_2", "seq": "()", "time": "1", "dim": "(60,)", "shape": "(60, 1)", "properties": {"max_value": null, "negative_slope": 0.0, "threshold": 0.0}}, "rhs_linear_3": {"class": "Linear", "name": "rhs_linear_3", "seq": "()", "time": "1", "dim": "(60,)", "shape": "(60, 1)", "properties": {"out_features": 60, "use_bias": true, "initializer": "glorot_uniform", "bias_initializer": "glorot_uniform"}}, "rhs_relu_3": {"class": "ReLU", "name": "rhs_relu_3", "seq": "()", "time": "1", "dim": "(60,)", "shape": "(60, 1)", "properties": {"max_value": null, "negative_slope": 0.0, "threshold": 0.0}}, "rhs_derivative_linear": {"class": "Linear", "name": "rhs_derivative_linear", "seq": "()", "time": "1", "dim": "(2,)", "shape": "(2, 1)", "properties": {"out_features": 2, "use_bias": true, "initializer": "glorot_uniform", "bias_initializer": "glorot_uniform"}}, "state_derivative": {"class": "Output", "name": "state_derivative", "seq": "()", "time": "1", "dim": "(2,)", "shape": "(2, 1)"}};

    const container = document.getElementById('network');
    const inspectorContent = document.getElementById('inspectorContent');
    const data = { nodes, edges };

    const options = {
        autoResize: true,
        interaction: {
            hover: true,
            tooltipDelay: 80,
            multiselect: true,
            navigationButtons: true,
            keyboard: true
        },
        physics: false,
        layout: {
            improvedLayout: true
        },
        nodes: {
            borderWidth: 1,
            shadow: true
        },
        edges: {
            smooth: false,
            shadow: false,
            font: {
                size: 10,
                align: "middle"
            }
        }
    };

    const network = new vis.Network(container, data, options);

    function escapeHtml(text) {
        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatValue(value) {
        if (value === null || value === undefined) return "";
        if (typeof value === "object") {
            return `<pre style="margin:0; white-space:pre-wrap;">${escapeHtml(JSON.stringify(value, null, 2))}</pre>`;
        }
        return escapeHtml(String(value));
    }

    function renderInspector(nodeId) {
        const details = nodeDetails[nodeId];
        const n = nodes.get(nodeId);

        if (!details) {
            inspectorContent.innerHTML = '<div class="empty">No details available for this node.</div>';
            return;
        }

        const rows = Object.entries(details).map(([key, value]) => {
            return `
            <tr>
                <th>${escapeHtml(key)}</th>
                <td>${formatValue(value)}</td>
            </tr>
            `;
        }).join("");

        let extra = "";
        if (n && n.url) {
            extra = `<a class="open-link" href="${escapeHtml(n.url)}" target="_self">Open nested model</a>`;
        }

        inspectorContent.innerHTML = `
            <table class="attr-table">
                <tbody>${rows}</tbody>
            </table>
            ${extra}
        `;
    }

    network.on("click", function(params) {
        if (!params.nodes || params.nodes.length === 0) return;
        const nodeId = params.nodes[0];
        renderInspector(nodeId);
    });

    network.on("doubleClick", function(params) {
        if (!params.nodes || params.nodes.length === 0) return;
        const nodeId = params.nodes[0];
        const n = nodes.get(nodeId);
        if (n && n.url) {
            const target = "_self";
            if (target === "_blank") {
                window.open(n.url, "_blank");
            } else {
                window.location.href = n.url;
            }
        }
    });

    const backBtn = document.getElementById("backBtn");
    if (backBtn) {
        backBtn.addEventListener("click", () => {
            const parentUrl = "vanderpol_system_identification__vanderpol_node.html";
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = parentUrl;
            }
        });
    }
</script>
