name: Coverage (Codecov)

on:
  pull_request:
    branches: ["main", "develop"]

jobs:
  coverage:
    name: Compute coverage (${{ matrix.keras-backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        keras-backend: [tensorflow, torch, jax]
    env:
      KERAS_BACKEND: ${{ matrix.keras-backend }}

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Tests with coverage
        run: uv run pytest --cov=nnodely --cov-branch --cov-report=xml:coverage-${{ matrix.keras-backend }}.xml tests

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage-${{ matrix.keras-backend }}.xml
          flags: ${{ matrix.keras-backend }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
